{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register</title>
  <link rel="stylesheet" href="{% static 'style1.css' %}">
  <script src="{% static 'script1.js' %}"></script>
</head>
<body>
    {% for message in messages %}
      <h3>{{ message }}</h3>
    {% endfor %}
    <div class="container">
      <h2>Register / Login</h2><br>
        <form id="loginForm" action="{% url 'signup' %}" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" formaction="{% url 'signup' %}">Submit</button>
        </form>
    </div>
</body>
</html>
