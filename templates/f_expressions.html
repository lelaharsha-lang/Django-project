<h2>F_expressions:</h2>
{% for book in books %}
    <p>Title: {{ book.title }}</p>
    <p>Author: {{ book.author }}</p>
    <p>Price: {{ book.price }}</p>
    <hr>
{% endfor %}
{% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
        {{ message }}
    </div>
{% endfor %}
<head>
<style>
    .alert {
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 15px;
}
.alert-success {
    background: #d4edda;
    color: #155724;
}
.alert-error {
    background: #f8d7da;
    color: #721c24;
}
</style>
</head>
