<h3>Delete Blog Posts</h3>
{% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
        {{ message }}
    </div>
{% endfor %}
<form method="POST">
    {% csrf_token %}
    <p>Are you sure you want to delete the blog post titled "{{ post.title }}"?</p>
    <button type="submit">Yes, Delete.</button>
    <a href="{% url 'view_posts' %}">Cancel</a>
</form>
